<html lang="en">
<head>

<title>Regression Lab</title>

<style>
/* Layout borrowed from the course slides: a grey-green panel on the left, a white field on the right. */
:root {
  --field: #FBFCFB;
  --panel: #DAE3E3;
  --ink: #1D2428;
  --muted: #4A5860;
  --rule: #B8C6C9;
  --grid: #E2E9E9;
  --axis: #8A979C;
  --data: #2B6A9E;   /* the points */
  --line: #B4561F;   /* the regression line, the errors, and the 2 SD lines */
  --bad: #A3242A;
  --wash: rgba(43, 106, 158, 0.09);
  --tip-bg: #1D2428;
  --tip-ink: #FBFCFB;
  --serif: 'Sorts Mill Goudy', 'Goudy Old Style', Georgia, 'Times New Roman', serif;
  --sans: 'Nunito Sans', 'Avenir Next', 'Segoe UI', Verdana, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --field: #172024;
    --panel: #1E292D;
    --ink: #E5ECEC;
    --muted: #A9B7BA;
    --rule: #36474D;
    --grid: #24313A;
    --axis: #6E8086;
    --data: #5598D4;
    --line: #CE7B45;
    --bad: #F0888C;
    --wash: rgba(85, 152, 212, 0.14);
    --tip-bg: #E5ECEC;
    --tip-ink: #172024;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--field); color: var(--ink); font: 15px/1.45 var(--sans); }
i { font-family: var(--serif); }
:focus-visible { outline: 3px solid var(--data); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.layout { display: grid; grid-template-columns: minmax(360px, 430px) minmax(0, 1fr); min-height: 100vh; }

/* ---------- the data panel ---------- */
.panel { background: var(--panel); padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 12px;
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: auto; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 2.45rem; line-height: 1.05; margin: 0; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 44ch; }
.lede i { font-size: 1.08em; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 10px; }
.lbl { font-weight: 700; font-size: 0.9rem; }
select { font: inherit; color: var(--ink); background-color: var(--field); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; min-width: 0; max-width: 100%; }
.source { grid-column: 1 / -1; margin: 0; font-size: 0.82rem; color: var(--muted); }

.tablebox { flex: 1 1 auto; min-height: 190px; overflow: auto; background: var(--field); border: 1px solid var(--rule); border-radius: 10px;
  scroll-padding: 46px 0 8px 36px; }
.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--field); border-bottom: 1px solid var(--rule); padding: 0; }
.grid .num { position: sticky; left: 0; z-index: 1; width: 34px; min-width: 34px; padding: 0 6px 0 4px; background: var(--field); color: var(--muted);
  font-weight: 400; font-size: 0.8rem; text-align: right; border-bottom: 1px solid var(--grid); }
.grid thead .num { z-index: 3; border-bottom-color: var(--rule); }
.grid td { padding: 0; border-bottom: 1px solid var(--grid); border-left: 1px solid var(--grid); }
.grid thead .var { border-left: 1px solid var(--grid); text-align: left; }
.grid.many .var { min-width: 176px; }
.varhead { display: flex; align-items: center; gap: 2px; padding-left: 8px; }
.role { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.25rem; line-height: 1; flex: none; padding-right: 2px; }
.role:empty { display: none; }
.name { flex: 1 1 auto; min-width: 0; width: 100%; font: inherit; font-weight: 700; font-size: 0.86rem; color: var(--ink); background: transparent; border: 0; padding: 9px 4px; border-radius: 4px; text-overflow: ellipsis; }
.cell { display: block; width: 100%; min-width: 76px; font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 0; padding: 5px 10px; text-align: right; }
.name:focus, .cell:focus { outline: 2px solid var(--data); outline-offset: -2px; background: var(--wash); }
.grid td.unused .cell { color: var(--muted); }
.grid tr.active .num { color: var(--ink); font-weight: 700; }
.cell.bad { outline: 2px solid var(--bad); outline-offset: -2px; color: var(--bad); }
.rm { flex: none; width: 24px; height: 24px; padding: 0; margin-right: 3px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: 1.1rem; line-height: 1; cursor: pointer; }
.rm:hover { background: var(--wash); color: var(--ink); }
@media (hover: hover) {   /* with a mouse, the remove button appears on hover, which leaves the full width for the name */
  .rm { position: absolute; right: 0; top: 50%; transform: translateY(-50%); opacity: 0; background: var(--field); }
  .var:hover .rm, .var:focus-within .rm { opacity: 1; }
  .many .var:focus-within .name { padding-right: 28px; }
}

.hint, .foot { margin: 0; font-size: 0.82rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button.act { font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.act:hover { border-color: var(--axis); }
.status { margin: 0; font-size: 0.9rem; font-weight: 600; min-height: 1.3em; }
.status .warn { display: block; color: var(--bad); font-weight: 600; }
.status .undo { font: inherit; font-weight: 700; color: var(--data); background: none; border: 0; padding: 0 0 0 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
@media (prefers-color-scheme: dark) { .status .undo { color: #8DBDE6; } }

/* ---------- the result ---------- */
.stage { padding: 20px clamp(18px, 3vw, 44px) 36px; min-width: 0; max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.readout { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 36px; }
.eq, .r { margin: 0; font-family: var(--serif); font-size: clamp(2rem, 3.5vw, 3.1rem); line-height: 1.12; font-variant-numeric: lining-nums; }
.eq.empty, .r.empty { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.vars { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0; }
.var-pick { display: flex; align-items: center; gap: 7px; min-width: 0; }
.var-pick label { white-space: nowrap; }
.var-pick label i { font-size: 1.3rem; font-weight: 400; }
.var-pick select { width: 190px; }
.show { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-left: auto; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--line); }
.check.off { opacity: 0.5; cursor: default; }
.check svg { display: block; }
.note { margin: 0; color: var(--muted); max-width: 72ch; }
.note:empty { display: none; }

.plotwrap { position: relative; }
.plotwrap svg.plot { display: block; width: 100%; height: auto; }
.plot text { font-family: var(--sans); }
.gl { stroke: var(--grid); stroke-width: 1; }
.ax { stroke: var(--axis); stroke-width: 1; fill: none; }
.tk { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.at { fill: var(--ink); font-size: 13px; font-weight: 700; }
.reg { stroke: var(--line); stroke-width: 2.5; stroke-linecap: round; }
.err { stroke: var(--line); stroke-width: 1.5; stroke-opacity: 0.55; }
.dense .err { stroke-width: 1; stroke-opacity: 0.35; }
.band { stroke: var(--line); stroke-width: 1.75; stroke-dasharray: 8 6; }
.bl { fill: var(--ink); font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--field); stroke-width: 3px; stroke-linejoin: round; }
.pt { fill: var(--data); stroke: var(--field); stroke-width: 1.5; }
.dense .pt { fill-opacity: 0.72; stroke-width: 0.8; }
.ring { fill: none; stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.msg { fill: var(--muted); font-size: 16px; text-anchor: middle; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 0.84rem; line-height: 1.35; padding: 6px 9px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip .k { opacity: 0.75; }
.tip .v { font-weight: 700; }

.captions { display: flex; flex-direction: column; gap: 3px; }
.captions p { margin: 0; font-size: 0.92rem; color: var(--muted); }
.more summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; color: var(--muted); width: fit-content; }
.more table { border-collapse: collapse; margin-top: 6px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.more th { text-align: left; font-weight: 400; color: var(--muted); padding: 2px 22px 2px 0; }
.more td { text-align: right; font-weight: 600; padding: 2px 0; }

@media (max-width: 899px) {
  .layout { display: block; min-height: 0; }
  .panel { position: static; height: auto; overflow: visible; padding: 18px 16px 14px; }
  .tablebox { flex: none; max-height: 330px; }
  .stage { padding: 16px 16px 28px; }
  .show { margin-left: 0; }
  .var-pick { flex: 1 1 100%; }
  .var-pick select { flex: 1 1 auto; width: auto; }
}
@media (pointer: coarse) {
  .cell, .name, select { font-size: 16px; }
  .cell { padding-block: 7px; }
  .hint { display: none; }
}
@media print {
  :root { --field: #FFFFFF; --ink: #000000; --muted: #333333; --grid: #E2E9E9; --axis: #666666; --rule: #999999; --data: #2B6A9E; --line: #B4561F; color-scheme: light; }
  .layout { display: block; }
  .panel, .show, .more, .tip { display: none !important; }
}
</style>
</head>
<body>
<div class="layout">

  <aside class="panel" aria-label="Your data">
    <header>
      <h1>Regression Lab</h1>
      <p class="lede">Math 119. Type your data, choose <i>x</i> and <i>y</i>, and see the least-squares line.</p>
    </header>

    <div class="pick">
      <label class="lbl" for="dataset">Data set</label>
      <select id="dataset" autocomplete="off"></select>
      <p class="source" id="source"></p>
    </div>

    <div class="tablebox" id="tablebox">
      <table class="grid" id="grid" aria-label="Data table. Each column is a variable and each row is one case."></table>
    </div>

    <p class="hint">Enter moves down and Tab moves across. You can also paste from a spreadsheet.</p>
    <div class="actions">
      <button type="button" class="act" id="addvar">Add variable</button>
      <button type="button" class="act" id="clear">Clear table</button>
    </div>
    <p class="status" id="status"></p>
    <p class="foot">Your table is saved in this browser and is never sent anywhere.</p>
  </aside>

  <main class="stage">
    <div class="readout">
      <p class="eq" id="eq"></p>
      <p class="r" id="r"></p>
    </div>

    <div class="controls">
      <div class="vars">
        <div class="var-pick"><label class="lbl" for="xvar"><i>x</i> is</label><select id="xvar" autocomplete="off"></select></div>
        <div class="var-pick"><label class="lbl" for="yvar"><i>y</i> is</label><select id="yvar" autocomplete="off"></select></div>
      </div>
      <div class="show" role="group" aria-label="Show on the plot">
        <span class="lbl">Show</span>
        <label class="check" id="errors-label"><input type="checkbox" id="opt-errors" autocomplete="off">
          <svg width="12" height="16" aria-hidden="true"><line class="err" x1="6" x2="6" y1="1" y2="15"/></svg>Errors</label>
        <label class="check" id="band-label"><input type="checkbox" id="opt-band" autocomplete="off">
          <svg width="26" height="16" aria-hidden="true"><line class="band" x1="0" x2="26" y1="8" y2="8"/></svg><span id="band-name">2 SD lines</span></label>
      </div>
    </div>

    <p class="note" id="note"></p>

    <div class="plotwrap" id="plot">
      <svg class="plot" id="svg" role="img" aria-label="Scatterplot"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>

    <div class="captions" id="captions"></div>

    <details class="more">
      <summary>Numbers behind the line</summary>
      <table id="details"></table>
    </details>
  </main>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<noscript><p style="padding:16px">This tool runs in your browser and needs JavaScript turned on.</p></noscript>

/* ===================================================================
   Statistics
   =================================================================== */

// Ordinary least squares for y on x. pts is a list of {x, y}.
// m and b minimize the sum of squared vertical errors.
function fit(pts) {
  const n = pts.length;
  const out = { n, hasLine: false, reason: n < 2 ? 'few' : '', r: NaN, sdErr: NaN };
  if (n === 0) return out;

  let sumX = 0, sumY = 0;
  for (const p of pts) { sumX += p.x; sumY += p.y; }
  const mx = sumX / n, my = sumY / n;
  out.mx = mx; out.my = my;
  if (n < 2) return out;

  let ssx = 0, ssy = 0, sxy = 0;
  for (const p of pts) {
    const dx = p.x - mx, dy = p.y - my;
    ssx += dx * dx; ssy += dy * dy; sxy += dx * dy;
  }
  if (![mx, my, ssx, ssy, sxy].every(Number.isFinite)) { out.reason = 'huge'; return out; }

  // Exact comparisons, because rounding in the mean can make a constant column look like it varies.
  const xFlat = pts.every((p) => p.x === pts[0].x);
  const yFlat = pts.every((p) => p.y === pts[0].y);
  out.sdx = xFlat ? 0 : Math.sqrt(ssx / (n - 1));
  out.sdy = yFlat ? 0 : Math.sqrt(ssy / (n - 1));
  if (xFlat) { out.reason = 'xflat'; return out; }

  const rootProduct = Math.sqrt(ssx) * Math.sqrt(ssy);
  if (!yFlat && Math.abs(sxy) <= 1e-13 * rootProduct) sxy = 0;   // r is zero apart from rounding

  let m = yFlat ? 0 : sxy / ssx;
  let b = yFlat ? pts[0].y : my - m * mx;
  if (Math.abs(b) <= 1e-11 * (Math.abs(m * mx) + Math.abs(my))) b = 0;

  let sse = 0;
  for (const p of pts) { const e = p.y - (m * p.x + b); sse += e * e; }
  if (yFlat || sse <= 1e-20 * ssy) sse = 0;                      // an exact fit, apart from rounding

  out.hasLine = true;
  out.m = m; out.b = b; out.sse = sse;
  out.yFlat = yFlat;
  out.r = yFlat ? NaN : sse === 0 ? Math.sign(m) : Math.max(-1, Math.min(1, sxy / rootProduct));
  const divisor = n - SD_DIVIDE_BY_N_MINUS;
  out.sdErr = divisor > 0 ? Math.sqrt(sse / divisor) : NaN;
  return out;
}

const predict = (F, x) => F.m * x + F.b;
const errorOf = (F, p) => (F.sse === 0 ? 0 : p.y - predict(F, p.x));

/* ===================================================================
   Reading and formatting numbers
   =================================================================== */

const MINUS = '−';

// Returns null for a blank, NaN for text that isn't a number, otherwise the number.
function parseNum(text) {
  let t = String(text).trim();
  if (t === '') return null;
  t = t.replace(/[−–]/g, '-');
  if (/^[-+]?\d{1,3}(,\d{3})+(\.\d*)?$/.test(t)) t = t.replace(/,/g, '');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return NaN;
  const v = Number(t);
  return Number.isFinite(v) ? v : NaN;
}

const SUPERSCRIPT = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = (k) => String(k).replace(/./g, (c) => SUPERSCRIPT[c]);
function group(s) {
  const [whole, dec] = s.split('.');
  const g = whole.replace(/\B(?=(\d{3})+$)/g, ',');
  return dec === undefined ? g : g + '.' + dec;
}
function scientific(a, digits) {
  let e = Math.floor(Math.log10(a));
  let t = (a / Math.pow(10, e)).toPrecision(digits);
  if (Number(t) >= 10) { e += 1; t = (a / Math.pow(10, e)).toPrecision(digits); }
  return t + ' × 10' + sup(e);
}
// Four significant figures. Whole-number parts are never rounded away.
function sig4(v) {
  if (!Number.isFinite(v)) return '–';
  if (v === 0) return '0';
  const a = Math.abs(v), sign = v < 0 ? MINUS : '';
  if (a >= 1e9 || a < 1e-4) return sign + scientific(a, 4);
  if (a >= 1000) { const t = String(Math.round(a)); return sign + (a >= 10000 ? group(t) : t); }
  return sign + a.toPrecision(4);
}
// Two decimals, as in class, but never rounds to ±1 unless the fit really is perfect.
function fmtR(r) {
  if (!Number.isFinite(r)) return '–';
  const a = Math.abs(r), sign = r < 0 ? MINUS : '';
  if (a === 1) return sign + '1.00';
  let d = 2, s = a.toFixed(d);
  while (Number(s) >= 1 && d < 8) { d += 1; s = a.toFixed(d); }
  return Number(s) === 0 ? '0.00' : sign + s;
}
const fmtR4 = (r) => { const s = Math.abs(r).toFixed(4); return (r < 0 && Number(s) !== 0 ? MINUS : '') + s; };
function tickText(v, step) {
  if (Math.abs(v) < step * 1e-9) return '0';
  const a = Math.abs(v), sign = v < 0 ? MINUS : '';
  if (step >= 1e9 || step < 1e-4) return sign + scientific(a, 3);
  let d = 0;
  while (d < 8 && Math.abs(Math.round(step * 10 ** d) - step * 10 ** d) > 1e-8 * 10 ** d * step) d += 1;
  const s = a.toFixed(d);
  return sign + (a >= 10000 ? group(s) : s);
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const blankRow = (cols) => Array.from({ length: cols }, () => '');
const blankTable = () => ({ names: ['Variable 1', 'Variable 2'], rows: Array.from({ length: MIN_ROWS }, () => blankRow(2)), x: 0, y: 1 });
const copyTable = (t) => JSON.parse(JSON.stringify(t));
const isBlankRow = (row) => row.every((v) => String(v).trim() === '');
const isBlankTable = (t) => t.rows.every(isBlankRow);

function fromExample(key) {
  const e = EXAMPLES[key];
  return padRows({ names: e.names.slice(), rows: e.rows.map((r) => r.map(String)), x: e.x ?? 0, y: e.y ?? 1 });
}
function padRows(t) {
  const cols = t.names.length;
  t.rows.forEach((row) => { while (row.length < cols) row.push(''); });
  if (!t.rows.length || !isBlankRow(t.rows[t.rows.length - 1])) t.rows.push(blankRow(cols));
  while (t.rows.length < MIN_ROWS) t.rows.push(blankRow(cols));
  return t;
}
const displayName = (c, t = S.table) => t.names[c].trim() || 'Variable ' + (c + 1);

function save() {
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(() => {
    try {
      const t = copyTable(S.mine);
      while (t.rows.length && isBlankRow(t.rows[t.rows.length - 1])) t.rows.pop();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(t));
    } catch (err) { /* private windows can refuse storage; the page still works */ }
  }, 250);
}
function restore() {
  try {
    const t = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    const ok = t && Array.isArray(t.names) && t.names.length >= 2 && t.names.every((s) => typeof s === 'string')
      && Array.isArray(t.rows) && t.rows.every((r) => Array.isArray(r) && r.every((v) => typeof v === 'string'))
      && Number.isInteger(t.x) && Number.isInteger(t.y) && t.x !== t.y && t.x >= 0 && t.y >= 0 && t.x < t.names.length && t.y < t.names.length;
    return ok ? padRows(t) : null;
  } catch (err) { return null; }
}

function setUndo(msg, mine, view) {
  S.undo = { msg, mine, view };
  clearTimeout(S.undoTimer);
  S.undoTimer = setTimeout(() => { S.undo = null; renderStatus(); }, 30000);
}
function doUndo() {
  const u = S.undo;
  S.undo = null; clearTimeout(S.undoTimer);
  S.mine = u.mine;
  if (u.view === 'mine') show(S.mine, 'mine'); else show(fromExample(u.view), u.view);
}
// Typing into an example turns it into the student's own table.
function touchTable() {
  if (S.view === 'mine') return;
  if (!isBlankTable(S.mine)) setUndo('Your earlier table was replaced.', S.mine, S.view);
  S.mine = S.table; S.view = 'mine';
  syncDataset();
}
// For changes to the whole table: remember what was there, then make it the student's own.
function beginBulkEdit(msg) {
  setUndo(msg, copyTable(S.mine), S.view);
  if (S.view !== 'mine') { S.mine = S.table; S.view = 'mine'; syncDataset(); }
}

function show(table, view) {
  S.table = table; S.view = view;
  padRows(table);
  syncDataset(); renderGrid(); syncVarSelects();
  $('tablebox').scrollTop = 0; $('tablebox').scrollLeft = 0;
  update();
}
function syncDataset() {
  $('dataset').value = S.view;
  $('source').textContent = S.view === 'mine' ? '' : EXAMPLES[S.view].source;
  // From an example, this button never wipes the student's own table.
  $('clear').textContent = S.view !== 'mine' && !isBlankTable(S.mine) ? 'Back to your data' : 'Clear table';
}

const cellInput = (r, c) => grid.querySelector(`input[data-r="${r}"][data-c="${c}"]`);

function rowHtml(r) {
  const t = S.table;
  let h = `<tr data-row="${r}"><th scope="row" class="num">${r + 1}</th>`;
  t.names.forEach((_, c) => {
    const unused = c !== t.x && c !== t.y ? ' class="unused"' : '';
    h += `<td${unused}><input class="cell" data-r="${r}" data-c="${c}" value="${esc(t.rows[r][c] ?? '')}" size="6" inputmode="numeric" enterkeyhint="next" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Row ${r + 1}, ${esc(displayName(c))}"></td>`;
  });
  return h + '</tr>';
}
function renderGrid() {
  const t = S.table;
  let head = '<thead><tr><th scope="col" class="num"><span class="sr">Row</span></th>';
  t.names.forEach((name, c) => {
    const remove = t.names.length > 2
      ? `<button type="button" class="rm" data-c="${c}" title="Remove this variable" aria-label="Remove ${esc(displayName(c))}">×</button>` : '';
    head += `<th scope="col" class="var"><div class="varhead"><span class="role" data-role="${c}" aria-hidden="true">${c === t.x ? 'x' : c === t.y ? 'y' : ''}</span>`
      + `<input class="name" data-r="-1" data-c="${c}" value="${esc(name)}" title="${esc(name)}" size="6" autocomplete="off" spellcheck="false" aria-label="Name of variable ${c + 1}">${remove}</div></th>`;
  });
  head += '</tr></thead>';
  let body = '<tbody>';
  for (let r = 0; r < t.rows.length; r++) body += rowHtml(r);
  grid.innerHTML = head + body + '</tbody>';
  grid.classList.toggle('many', t.names.length > 2);
}
function syncRoles() {
  const t = S.table;
  grid.querySelectorAll('.role').forEach((el) => {
    const c = Number(el.dataset.role);
    el.textContent = c === t.x ? 'x' : c === t.y ? 'y' : '';
  });
  grid.querySelectorAll('tbody td').forEach((td) => {
    const c = Number(td.firstElementChild.dataset.c);
    td.classList.toggle('unused', c !== t.x && c !== t.y);
  });
}
function syncVarSelects() {
  const t = S.table;
  for (const [id, chosen] of [['xvar', t.x], ['yvar', t.y]]) {
    const sel = $(id);
    sel.replaceChildren(...t.names.map((_, c) => {
      const o = document.createElement('option');
      o.value = c; o.textContent = displayName(c);
      return o;
    }));
    sel.value = chosen;
  }
}
function chooseVariable(role, c) {
  const t = S.table, other = role === 'x' ? 'y' : 'x';
  if (t[other] === c) t[other] = t[role];     // picking the other role's variable swaps them
  t[role] = c;
  syncVarSelects(); syncRoles(); revealColumn(c); update();
}
// Scrolls the table sideways, and only sideways, to show the x and y columns if both fit, or else the one just chosen.
function revealColumn(c) {
  const t = S.table, box = $('tablebox'), rowNumbers = 34, slack = 4;
  const edges = (k) => {
    const r = cellInput(-1, k).closest('th').getBoundingClientRect();
    const left = r.left - box.getBoundingClientRect().left - box.clientLeft + box.scrollLeft;
    return [left, left + r.width];
  };
  const [xLeft, xRight] = edges(t.x), [yLeft, yRight] = edges(t.y);
  const lo = Math.min(xLeft, yLeft), hi = Math.max(xRight, yRight);
  const [left, right] = hi - lo <= box.clientWidth - rowNumbers + slack ? [lo, hi] : edges(c);
  if (left < box.scrollLeft + rowNumbers) box.scrollLeft = left - rowNumbers;
  else if (right > box.scrollLeft + box.clientWidth + slack) box.scrollLeft = Math.min(left - rowNumbers, right - box.clientWidth);
}
function flagBadCells() {
  const t = S.table, focused = document.activeElement;
  grid.querySelectorAll('tbody .cell').forEach((el) => {
    const c = Number(el.dataset.c);
    const bad = (c === t.x || c === t.y) && el !== focused && Number.isNaN(parseNum(el.value));
    if (bad !== el.classList.contains('bad')) {
      el.classList.toggle('bad', bad);
      if (bad) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
    }
  });
}
function addRow() {
  const t = S.table;
  if (t.rows.length >= MAX_ROWS) return false;
  t.rows.push(blankRow(t.names.length));
  grid.tBodies[0].insertAdjacentHTML('beforeend', rowHtml(t.rows.length - 1));
  return true;
}
function focusCell(r, c) {
  const t = S.table;
  if (c < 0 || c >= t.names.length || r < -1) return;
  if (r >= t.rows.length && !addRow()) return;
  const el = cellInput(r, c);
  if (!el) return;
  el.focus();
  el.select();
}

grid.addEventListener('input', (e) => {
  const el = e.target;
  const r = Number(el.dataset.r), c = Number(el.dataset.c);
  touchTable();
  const t = S.table;

    t.names[c] = el.value;
    el.title = el.value;

    const rm = grid.querySelector(`.rm[data-c="${c}"]`);

grid.addEventListener('keydown', (e) => {

  const atStart = el.selectionStart === 0 && el.selectionEnd === 0;
  const atEnd = el.selectionStart === el.value.length && el.selectionEnd === el.value.length;
  let to = null;
  if (e.key === 'Enter') to = [r + (e.shiftKey ? -1 : 1), c];
  else if (e.key === 'ArrowDown') to = [r + 1, c];
  else if (e.key === 'ArrowUp') to = [r - 1, c];
  else if (e.key === 'ArrowLeft' && atStart) to = [r, c - 1];
  else if (e.key === 'ArrowRight' && atEnd) to = [r, c + 1];
  if (to) { e.preventDefault(); focusCell(to[0], to[1]); }
});

grid.addEventListener('focusin', (e) => {
  const el = e.target;
  if (!el.matches('.cell, .name')) return;
  const r = Number(el.dataset.r), c = Number(el.dataset.c);
  S.active = r >= 0 ? { r, c } : null;
  markActiveRow();
  syncRing();
  queueUpdate();    // a bad cell is not flagged while it is being typed in
});
grid.addEventListener('focusout', () => {
  S.active = null;
  markActiveRow();
  syncRing();
  queueUpdate();
});
function markActiveRow() {
  grid.querySelectorAll('tr.active').forEach((tr) => tr.classList.remove('active'));
  if (S.active) { const tr = grid.querySelector(`tr[data-row="${S.active.r}"]`); if (tr) tr.classList.add('active'); }
}

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.rm');
  if (btn) removeVariable(Number(btn.dataset.c));
});

function addVariable() {
  touchTable();
  const t = S.table;
  let k = t.names.length + 1;
  while (t.names.includes('Variable ' + k)) k += 1;
  t.names.push('Variable ' + k);
  t.rows.forEach((row) => row.push(''));
  renderGrid(); syncVarSelects(); update();
  const el = cellInput(-1, t.names.length - 1);
  el.focus(); el.select();
}
function removeVariable(c) {
  beginBulkEdit('Removed ' + displayName(c) + '.');
  const t = S.table;
  t.names.splice(c, 1);
  t.rows.forEach((row) => row.splice(c, 1));
  const shift = (i) => (i === c ? null : i > c ? i - 1 : i);
  let x = shift(t.x), y = shift(t.y);
  const firstOther = (o) => t.names.findIndex((_, i) => i !== o);
  if (x === null) x = firstOther(y);
  if (y === null) y = firstOther(x);
  t.x = x; t.y = y;
  renderGrid(); syncVarSelects(); update();
}
function clearTable() {
  if (S.view === 'mine') {
    setUndo('Table cleared.', copyTable(S.mine), 'mine');
    S.mine = blankTable();
  }
  const wasBlank = isBlankTable(S.mine);
  show(S.mine, 'mine');
  if (wasBlank) focusCell(0, 0);
}

/* ---------- pasting from a spreadsheet ---------- */

function splitDelimited(line, sep) {
  const cells = []; let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i += 1; }
      else if (ch === '"') quoted = false;
      else cur += ch;
    } else if (ch === '"' && cur.trim() === '') { quoted = true; cur = ''; }
    else if (ch === sep) { cells.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}
// Returns an array of rows, or null when the text is a single value and should paste normally.
function parseClipboard(text) {
  const lines = text.replace(/\r\n?/g, '\n').replace(/\n+$/, '').split('\n');
  const all = lines.join('\n');
  let rows;
  if (all.includes('\t')) rows = lines.map((l) => l.split('\t').map((s) => s.trim()));
  else if (lines.length === 1) {
    if (parseNum(lines[0]) !== null && !Number.isNaN(parseNum(lines[0]))) return null;   // one number, such as 1,200
    const sep = lines[0].includes(',') ? ',' : lines[0].includes(';') ? ';' : null;
    const cells = sep ? splitDelimited(lines[0], sep) : lines[0].trim().split(/\s+/);
    if (cells.length < 2 || !cells.every((s) => Number.isFinite(parseNum(s)))) return null;   // a name, or ordinary text
    rows = [cells];
  }
  else if (lines.some((l) => l.includes(','))) rows = lines.map((l) => splitDelimited(l, ','));
  else if (lines.some((l) => l.includes(';'))) rows = lines.map((l) => splitDelimited(l, ';'));
  else {
    rows = lines.map((l) => l.trim().split(/\s+/));
    const width = rows.length > 1 ? rows[1].length : rows[0].length;
    if (rows[0].length !== width && rows[0].some((s) => !Number.isFinite(parseNum(s)))) rows.shift();   // names with spaces can't be split safely
  }
  return rows;
}
function applyPaste(rows, r, c) {
  const hasNames = rows[0].some((s) => s !== '' && !Number.isFinite(parseNum(s)));
  const atTop = r <= 0;
  const names = hasNames && atTop && (rows.length > 1 || r < 0) ? rows[0] : null;
  let values = names ? rows.slice(1) : rows;
  let startRow = Math.max(r, 0);

  const before = S.table;
  const filledCols = before.names.filter((_, i) => before.rows.some((row) => String(row[i]).trim() !== '')).length;
  const width = rows.reduce((w, row) => Math.max(w, row.length), 0);
  const replaceAll = atTop && c === 0 && width >= filledCols;   // a new data set pasted at the top left replaces the old one

  const dropped = Math.max(0, startRow + values.length - MAX_ROWS);
  if (dropped) values = values.slice(0, MAX_ROWS - startRow);

  beginBulkEdit(`Pasted ${values.length} ${values.length === 1 ? 'row' : 'rows'}` + (dropped ? `; the last ${dropped} didn’t fit (limit ${MAX_ROWS}).` : '.'));
  if (replaceAll) {
    S.mine = blankTable();
    S.table = S.mine;
    S.table.names = [];
    S.table.rows = [];
  }
  const t = S.table;
  while (t.names.length < Math.max(c + width, replaceAll ? 2 : 0)) {
    let k = t.names.length + 1;
    while (t.names.includes('Variable ' + k)) k += 1;
    t.names.push('Variable ' + k);
    t.rows.forEach((row) => row.push(''));
  }
  if (names) names.forEach((s, i) => { if (s !== '') t.names[c + i] = s; });
  while (t.rows.length < startRow + values.length) t.rows.push(blankRow(t.names.length));
  values.forEach((row, i) => row.forEach((s, j) => { t.rows[startRow + i][c + j] = s; }));
  if (t.x >= t.names.length) t.x = 0;
  if (t.y >= t.names.length || t.y === t.x) t.y = t.x === 0 ? 1 : 0;
  show(t, 'mine');
  const el = cellInput(startRow, c);
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
grid.addEventListener('paste', (e) => {
  const el = e.target;
  if (!el.matches('input')) return;
  const rows = parseClipboard((e.clipboardData || window.clipboardData).getData('text'));
  if (!rows || !rows.length) return;
  e.preventDefault();
  applyPaste(rows, Number(el.dataset.r), Number(el.dataset.c));
});

/* ===================================================================
   From the table to the numbers on screen
   =================================================================== */

function collect() {
  const t = S.table, pts = [], issues = [];
  t.rows.forEach((row, i) => {
    const sx = row[t.x] ?? '', sy = row[t.y] ?? '';
    const vx = parseNum(sx), vy = parseNum(sy);
    if (vx === null && vy === null) return;
    if (Number.isFinite(vx) && Number.isFinite(vy)) { pts.push({ x: vx, y: vy, row: i }); return; }
    if (S.active && S.active.r === i) return;     // still being typed
    const badText = Number.isNaN(vx) ? sx : Number.isNaN(vy) ? sy : null;
    if (badText !== null) {
      const shown = badText.trim().length > 18 ? badText.trim().slice(0, 17) + '…' : badText.trim();
      issues.push(`Row ${i + 1} left out: “${shown}” is not a number.`);
    } else {
      issues.push(`Row ${i + 1} left out: no ${vx === null ? 'x' : 'y'} value.`);
    }
  });
  return { pts, issues };
}

function queueUpdate() {
  if (S.queued) return;
  S.queued = true;
  requestAnimationFrame(() => { S.queued = false; update(); });
}
function update() {
  const c = collect();
  S.pts = c.pts; S.issues = c.issues;
  S.fit = fit(S.pts);
  flagBadCells();
  renderReadout(); renderNote(); renderToggles(); renderCaptions(); renderDetails(); renderStatus();
  drawPlot(false);
  announce();
  save();
}

function equationHtml(F) {
  const mText = sig4(F.m);
  const slope = mText.includes('×') ? `(${mText})` : mText;
  const sign = F.b < 0 ? MINUS : '+';
  return `<i>y</i> = ${slope}<i>x</i> ${sign} ${sig4(Math.abs(F.b))}`;
}
function renderReadout() {
  const F = S.fit, eq = $('eq'), r = $('r');
  eq.classList.toggle('empty', !F.hasLine);
  eq.innerHTML = F.hasLine ? equationHtml(F) : '<i>y</i> = <i>m</i><i>x</i> + <i>b</i>';
  r.classList.toggle('empty', !Number.isFinite(F.r));
  r.innerHTML = `<i>r</i> = ${fmtR(F.r)}`;
}
function renderNote() {
  const F = S.fit;
  let t = '';
  if (F.n === 1) t = 'One point so far. A line needs at least two.';
  else if (F.reason === 'xflat') t = 'Every x value is the same, so the line would be vertical. A vertical line has no slope, so there is no equation and no r.';
  else if (F.reason === 'huge') t = 'These numbers are too large to calculate with.';
  else if (F.hasLine && F.yFlat) t = 'Every y value is the same, so the line is flat. r can’t be calculated because y never varies.';
  else if (F.hasLine && F.n === 2) t = 'Two points always lie exactly on a line, so r is 1 or −1 whatever the numbers are.';
  $('note').textContent = t;
}
function renderToggles() {
  const can = S.fit.hasLine;
  for (const [box, label] of [['opt-errors', 'errors-label'], ['opt-band', 'band-label']]) {
    $(box).disabled = !can;
    $(label).classList.toggle('off', !can);
  }
}
function renderCaptions() {
  const F = S.fit, box = $('captions');
  const lines = [];
  if (F.hasLine && S.opts.errors) {
    lines.push(F.sse === 0
      ? 'Every point is on the line, so every error is 0.'
      : `Errors are actual y minus predicted y. Their squares add up to ${sig4(F.sse)}, the smallest total any straight line can get.`);
  }
  if (F.hasLine && S.opts.band) {
    if (!Number.isFinite(F.sdErr)) lines.push(`The SD of the errors needs at least ${SD_DIVIDE_BY_N_MINUS + 1} points.`);
    else if (F.sdErr === 0) lines.push('The SD of the errors is 0, so the dashed lines would sit right on the line.');
    else {
      const reach = BAND_SDS * F.sdErr;
      const inside = S.pts.filter((p) => Math.abs(errorOf(F, p)) <= reach).length;
      lines.push(`The dashed lines are ${BAND_SDS} SDs of the errors from the line (${BAND_SDS} × ${sig4(F.sdErr)} = ${sig4(reach)}). ${inside} of ${F.n} points (${Math.round(100 * inside / F.n)}%) fall between them.`);
    }
  }
  box.replaceChildren(...lines.map((t) => { const p = document.createElement('p'); p.textContent = t; return p; }));
}
function renderDetails() {
  const F = S.fit;
  const v = (k) => (k === undefined ? '–' : sig4(k));
  const rows = [
    ['Rows plotted, n', String(F.n)],
    ['r, to four decimal places', Number.isFinite(F.r) ? fmtR4(F.r) : '–'],
    ['Mean of x', v(F.mx)], ['SD of x', v(F.sdx)],
    ['Mean of y', v(F.my)], ['SD of y', v(F.sdy)],
    ['Slope, m = r × SD of y ÷ SD of x', F.hasLine ? sig4(F.m) : '–'],
    ['Intercept, b = mean of y − m × mean of x', F.hasLine ? sig4(F.b) : '–'],
    ['Sum of squared errors', F.hasLine ? sig4(F.sse) : '–'],
    [`SD of the errors = √(sum of squared errors ÷ (n − ${SD_DIVIDE_BY_N_MINUS}))`, F.hasLine ? sig4(F.sdErr) : '–'],
  ];
  $('details').replaceChildren(...rows.map(([k, val]) => {
    const tr = document.createElement('tr'), th = document.createElement('th'), td = document.createElement('td');
    th.scope = 'row'; th.textContent = k; td.textContent = val;
    tr.append(th, td);
    return tr;
  }));
}
function renderStatus() {
  const el = $('status'), n = S.pts.length;
  // Rebuilt only when it changes, so keyboard focus on Undo isn't lost.
  const signature = JSON.stringify([n, S.undo && S.undo.msg, S.issues]);
  if (signature === el.dataset.signature) return;
  el.dataset.signature = signature;
  el.replaceChildren();
  el.append(n === 0 ? 'No rows plotted yet.' : `${n} ${n === 1 ? 'row' : 'rows'} plotted.`);
  if (S.undo) {
    el.append(' ' + S.undo.msg);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'undo'; b.textContent = 'Undo';
    b.addEventListener('click', doUndo);
    el.append(b);
  }
  const shown = S.issues.slice(0, 2);
  if (S.issues.length > 2) shown.push(`${S.issues.length - 2} more ${S.issues.length === 3 ? 'row' : 'rows'} left out.`);
  for (const t of shown) {
    const w = document.createElement('span');
    w.className = 'warn'; w.textContent = t;
    el.append(w);
  }
}
function summaryText() {
  const F = S.fit;
  if (!F.hasLine) return F.n === 0 ? 'No data plotted yet.' : `${F.n} ${F.n === 1 ? 'point' : 'points'} plotted, no line.`;
  const eq = `y = ${sig4(F.m)} x ${F.b < 0 ? 'minus' : 'plus'} ${sig4(Math.abs(F.b))}`;
  return `${F.n} points. Least-squares line: ${eq}. r = ${Number.isFinite(F.r) ? fmtR(F.r) : 'undefined'}.`;
}
function announce() {
  clearTimeout(S.liveTimer);
  S.liveTimer = setTimeout(() => {
    const t = summaryText() + (S.issues.length ? ' ' + S.issues[0] : '');
    if ($('live').textContent !== t) $('live').textContent = t;
  }, 900);
}

/* ===================================================================
   The plot
   =================================================================== */

function padRange(lo, hi) {
  if (hi - lo <= Math.max(Math.abs(lo), Math.abs(hi)) * 1e-12) { const d = Math.abs(hi) * 0.1 || 1; return [lo - d, hi + d]; }
  const d = (hi - lo) * 0.06;
  return [lo - d, hi + d];
}
function extent(vals) {
  let lo = Infinity, hi = -Infinity;
  for (const v of vals) { if (v < lo) lo = v; if (v > hi) hi = v; }
  return [lo, hi];
}
// The y axis grows to fit the dashed lines only when they are on.
function targetRanges() {
  const F = S.fit;
  const dx = padRange(...extent(S.pts.map((p) => p.x)));
  const ys = S.pts.map((p) => p.y);
  if (F.hasLine) {
    const a = predict(F, dx[0]), c = predict(F, dx[1]);
    ys.push(a, c);
    if (S.opts.band && Number.isFinite(F.sdErr)) {
      const reach = BAND_SDS * F.sdErr;
      ys.push(a + reach, a - reach, c + reach, c - reach);
    }
  }
  const dy = padRange(...extent(ys));
  const usable = [...dx, ...dy, dx[1] - dx[0], dy[1] - dy[0]].every(Number.isFinite);
  return usable ? { dx, dy } : null;
}
function niceStep(range, count) {
  const raw = range / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 2.25 ? 2 : f < 3.5 ? 2.5 : f < 7.5 ? 5 : 10) * p;
}
function makeTicks([lo, hi], count) {
  const step = niceStep(hi - lo, count), vals = [], first = Math.ceil(lo / step - 1e-9);
  // Counted, so that extreme numbers can never make this loop run forever.
  for (let i = 0; i < 40; i++) {
    const v = (first + i) * step;
    if (v > hi + step * 1e-9) break;
    if (!vals.length || v > vals[vals.length - 1]) vals.push(v);
  }
  return { step, vals };
}
function plotSize() {
  const wrap = $('plot');
  const W = Math.max(280, Math.round(wrap.clientWidth));
  let H;
  if (window.matchMedia('(min-width: 900px)').matches) {
    const top = wrap.getBoundingClientRect().top + window.scrollY;
    H = Math.max(340, Math.min(W * 0.78, window.innerHeight - top - 84));
  } else {
    H = Math.max(280, Math.min(W * 0.82, 480));
  }
  return { W, H: Math.round(H) };
}
function clipName(s, px) {
  const max = Math.max(6, Math.floor(px / 7.4));
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

function drawPlot(animate) {
  cancelAnimationFrame(S.raf);
  const target = S.pts.length && S.fit.reason !== 'huge' ? targetRanges() : null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (animate && target && S.shown && S.pts.length <= 1500 && !reduced) {
    const from = S.shown.dy, t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 280), e = 1 - Math.pow(1 - k, 3);
      paint({ dx: target.dx, dy: [from[0] + (target.dy[0] - from[0]) * e, from[1] + (target.dy[1] - from[1]) * e] });
      if (k < 1) S.raf = requestAnimationFrame(step);
    };
    S.raf = requestAnimationFrame(step);
  } else paint(target);
}

function paint(ranges) {
  const svg = $('svg'), { W, H } = plotSize(), F = S.fit, t = S.table;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  S.shown = ranges;
  if (!ranges) {
    S.geo = null;
    const message = S.pts.length ? 'These numbers are too large to plot.' : 'Type at least two rows of numbers to draw the line.';
    svg.setAttribute('aria-label', 'Empty plot. ' + message);
    svg.innerHTML = `<text class="msg" x="${W / 2}" y="${H / 2}">${message}</text>`;
    syncRing();
    return;
  }
  const { dx, dy } = ranges;
  const tx = makeTicks(dx, W < 520 ? 5 : 8), ty = makeTicks(dy, 6);
  const yLabels = ty.vals.map((v) => tickText(v, ty.step));
  const L = Math.max(46, Math.max(...yLabels.map((s) => s.length)) * 7.4 + 14), R = 20, T = 30, B = 50;
  const X = (v) => L + (v - dx[0]) / (dx[1] - dx[0]) * (W - L - R);
  const Y = (v) => H - B - (v - dy[0]) / (dy[1] - dy[0]) * (H - T - B);
  S.geo = { W, H, L, R, T, B, X, Y };
  const f1 = (v) => v.toFixed(1);
  const n = S.pts.length, dense = n > 150, rad = dense ? 3.6 : n > 40 ? 4.6 : 6;

  let s = '';
  tx.vals.forEach((v) => { s += `<line class="gl" x1="${f1(X(v))}" x2="${f1(X(v))}" y1="${T}" y2="${H - B}"/>`; });
  ty.vals.forEach((v) => { s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/>`; });
  s += `<path class="ax" d="M${L} ${T}V${H - B}H${W - R}"/>`;
  tx.vals.forEach((v) => { s += `<text class="tk" text-anchor="middle" x="${f1(X(v))}" y="${H - B + 18}">${tickText(v, tx.step)}</text>`; });
  ty.vals.forEach((v, i) => { s += `<text class="tk" text-anchor="end" x="${L - 8}" y="${f1(Y(v) + 4)}">${yLabels[i]}</text>`; });
  s += `<text class="at" text-anchor="middle" x="${(L + W - R) / 2}" y="${H - 11}">${esc(clipName(displayName(t.x), W - L - R))}</text>`;
  s += `<text class="at" x="${L}" y="${T - 13}">${esc(clipName(displayName(t.y), W - L - R))}</text>`;

  s += `<clipPath id="plot-area"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath>`;
  s += `<g class="${dense ? 'dense' : ''}">`;
  if (F.hasLine) {
    const lineY0 = predict(F, dx[0]), lineY1 = predict(F, dx[1]);
    s += '<g clip-path="url(#plot-area)">';
    if (S.opts.band && F.sdErr > 0) {
      const reach = BAND_SDS * F.sdErr;
      for (const sign of [1, -1]) {
        s += `<line class="band" data-band="${sign}" x1="${f1(X(dx[0]))}" y1="${f1(Y(lineY0 + sign * reach))}" x2="${f1(X(dx[1]))}" y2="${f1(Y(lineY1 + sign * reach))}"/>`;
      }
    }
    if (S.opts.errors && F.sse > 0) {
      S.pts.forEach((p) => {
        s += `<line class="err" data-row="${p.row}" x1="${f1(X(p.x))}" x2="${f1(X(p.x))}" y1="${f1(Y(p.y))}" y2="${f1(Y(predict(F, p.x)))}"/>`;
      });
    }
    s += `<line class="reg" x1="${f1(X(dx[0]))}" y1="${f1(Y(lineY0))}" x2="${f1(X(dx[1]))}" y2="${f1(Y(lineY1))}"/>`;
    s += '</g>';
  }
  S.pts.forEach((p) => { s += `<circle class="pt" data-row="${p.row}" cx="${f1(X(p.x))}" cy="${f1(Y(p.y))}" r="${rad}"/>`; });
  if (F.hasLine && S.opts.band && F.sdErr > 0) {
    // Each label sits clear of its dashed line, allowing for how far the line climbs under the label.
    const reach = BAND_SDS * F.sdErr, end = predict(F, dx[1]), right = W - R - 4, labelWidth = 46;
    const climb = Math.abs(Y(predict(F, dx[1])) - Y(predict(F, dx[0]))) / (X(dx[1]) - X(dx[0])) * labelWidth;
    const above = Y(end + reach) - 7 - (F.m < 0 ? climb : 0);
    let below = Y(end - reach) + 16 + (F.m > 0 ? climb : 0);
    if (below > H - B - 3) below = Y(end - reach) - 7 - climb;
    s += `<text class="bl" text-anchor="end" x="${right}" y="${f1(above)}">+${BAND_SDS} SD</text>`;
    s += `<text class="bl" text-anchor="end" x="${right}" y="${f1(below)}">${MINUS}${BAND_SDS} SD</text>`;
  }
  s += '</g>';
  s += `<circle class="ring" id="ring" r="${rad + 4}" visibility="hidden"/>`;
  svg.innerHTML = s;
  const names = `${displayName(t.y)} against ${displayName(t.x)}`;
  svg.setAttribute('aria-label', `Scatterplot of ${names}. ${summaryText()}`);
  syncRing();
}

/* ---------- reading one point ---------- */

function syncRing() {
  const ring = $('ring');
  const row = S.hover !== null ? S.hover : S.active ? S.active.r : null;
  const p = row === null ? null : S.pts.find((q) => q.row === row);
  if (!ring || !p || !S.geo) {
    if (ring) ring.setAttribute('visibility', 'hidden');
    $('tip').hidden = true;
    return;
  }
  const cx = S.geo.X(p.x), cy = S.geo.Y(p.y);
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('visibility', 'visible');
  showTip(p, cx, cy);
}
function showTip(p, cx, cy) {
  const tip = $('tip'), F = S.fit;
  const line = (text, cls) => { const d = document.createElement('div'); d.textContent = text; if (cls) d.className = cls; return d; };
  const plain = (v) => String(v).replace('-', MINUS);
  const parts = [line(`x = ${plain(p.x)}, y = ${plain(p.y)}`, 'v'), line(`Row ${p.row + 1}`, 'k')];
  if (S.opts.errors && F.hasLine) {
    const e = errorOf(F, p);
    parts.splice(1, 0, line(`The line predicts ${sig4(predict(F, p.x))}`), line(`Error: ${e > 0 ? '+' : ''}${sig4(e)}`));
  }
  tip.replaceChildren(...parts);
  tip.hidden = false;
  const scale = $('svg').getBoundingClientRect().width / S.geo.W || 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight, W = S.geo.W * scale;
  let left = cx * scale + 12, top = cy * scale - th - 10;
  if (left + tw > W) left = cx * scale - 12 - tw;
  if (left < 0) left = 0;
  if (top < 0) top = cy * scale + 12;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function nearestRow(e) {
  if (!S.geo || !S.pts.length) return null;
  const rc = $('svg').getBoundingClientRect(), k = S.geo.W / rc.width;
  const px = (e.clientX - rc.left) * k, py = (e.clientY - rc.top) * k;
  let best = null, bestD = 24 * 24;
  for (const p of S.pts) {
    const dx = S.geo.X(p.x) - px, dy = S.geo.Y(p.y) - py, d = dx * dx + dy * dy;
    if (d <= bestD) { bestD = d; best = p.row; }
  }
  return best;
}
const plotEl = $('plot');
plotEl.addEventListener('pointermove', (e) => {
  const row = nearestRow(e);
  if (row !== S.hover) { S.hover = row; syncRing(); }
  plotEl.style.cursor = row !== null && e.pointerType === 'mouse' ? 'pointer' : '';
});
plotEl.addEventListener('pointerdown', (e) => {
  S.lastPointer = e.pointerType;
  S.hover = nearestRow(e); syncRing();
});
// A finger "leaves" as soon as it lifts, so a tapped point stays shown until the next tap elsewhere.
plotEl.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') { S.hover = null; syncRing(); } });
plotEl.addEventListener('pointercancel', () => { S.hover = null; syncRing(); });
document.addEventListener('pointerdown', (e) => { if (S.hover !== null && !plotEl.contains(e.target)) { S.hover = null; syncRing(); } });
plotEl.addEventListener('click', () => {
  if (S.lastPointer === 'mouse' && S.hover !== null) focusCell(S.hover, S.table.x);   // jump to this point's row
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('tip').hidden = true; });

/* ===================================================================
   Start up
   =================================================================== */

(function start() {
  $('band-name').textContent = BAND_SDS + ' SD lines';
  const dataset = $('dataset');
  let options = '<option value="mine">Your data</option><optgroup label="Examples">';
  for (const [key, e] of Object.entries(EXAMPLES)) options += `<option value="${key}">${esc(e.label)}</option>`;
  dataset.innerHTML = options + '</optgroup>';

  dataset.addEventListener('change', () => {
    const v = dataset.value;
    S.undo = null; clearTimeout(S.undoTimer);   // an Undo left over from another table would only confuse
    if (v === 'mine') show(S.mine, 'mine'); else show(fromExample(v), v);
  });
  $('xvar').addEventListener('change', (e) => chooseVariable('x', Number(e.target.value)));
  $('yvar').addEventListener('change', (e) => chooseVariable('y', Number(e.target.value)));
  $('addvar').addEventListener('click', addVariable);
  $('clear').addEventListener('click', clearTable);

  // Both options start off on every visit.
  const errors = $('opt-errors'), band = $('opt-band');
  errors.checked = false; band.checked = false;
  errors.addEventListener('change', () => { S.opts.errors = errors.checked; renderCaptions(); drawPlot(false); });
  band.addEventListener('change', () => { S.opts.band = band.checked; renderCaptions(); drawPlot(true); });

  let lastSize = '';
  const repaintIfResized = () => {
    const size = $('plot').clientWidth + 'x' + window.innerHeight;
    if (size !== lastSize) { lastSize = size; drawPlot(false); }
  };
  new ResizeObserver(() => requestAnimationFrame(repaintIfResized)).observe($('plot'));
  window.addEventListener('resize', () => requestAnimationFrame(repaintIfResized));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawPlot(false));   // the fonts can move the plot's top edge

  const saved = restore();
  S.mine = saved || blankTable();
  if (saved && !isBlankTable(saved)) show(S.mine, 'mine');
  else show(fromExample('penguins10'), 'penguins10');
})();
</script>
</body>
